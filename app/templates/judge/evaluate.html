{% extends "base.html" %}{% block title %}Evaluate{% endblock %}{% block nav %}<a href="/judge/dashboard">Dashboard</a><a href="/logout">Logout</a>{% endblock %}{% block content %}<h1>Evaluate {{submission.title}}</h1><p class="muted">{{submission.team.name}} · {{submission.description}}</p><div class="card"><div id="criteria">{% for c in criteria %}<label>{{c.name}} <span class="muted">(0-{{c.max_score}}, weight {{c.weight}})</span><input type="number" step="0.1" min="0" max="{{c.max_score}}" data-criterion="{{c.id}}" value="{{scores[c.id].raw_score if c.id in scores else ''}}"></label>{% endfor %}</div><label>Feedback<textarea id="feedback"></textarea></label><button class="btn" id="save" type="button">Save scores</button><p id="result"></p></div><script>
document.getElementById("save").addEventListener("click",async()=>{const out=document.getElementById("result");for(const input of document.querySelectorAll("[data-criterion]")){if(input.value==="")continue;const r=await fetch("/api/judging/evaluate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({submission_id:{{submission.id}},criterion_id:Number(input.dataset.criterion),raw_score:Number(input.value),feedback:document.getElementById("feedback").value})});if(!r.ok){out.textContent=await r.text();return}}out.textContent="Scores saved.";});
</script>{% endblock %}
