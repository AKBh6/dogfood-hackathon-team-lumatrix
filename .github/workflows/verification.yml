name: verification
on:
  push:
    branches: ["main", "dogfood-complete"]
  pull_request:
    branches: ["main"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m compileall app
      - run: python -m pytest -q
      - run: docker build -t dogfood-platform .
      - run: docker run -d --name dogfood-platform -p 8000:8000 dogfood-platform
      - run: |
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8000/ && exit 0
            sleep 2
          done
          docker logs dogfood-platform
          exit 1
      - if: always()
        run: docker logs dogfood-platform
      - if: always()
        run: docker rm -f dogfood-platform
