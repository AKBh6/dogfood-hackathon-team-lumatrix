{% extends "base.html" %}

{% block title %}Register - Dogfood Platform{% endblock %}

{% block nav %}
<a href="/login">Login</a>
{% endblock %}

{% block content %}
<div class="auth-card">
    <h2>Create Account</h2>
    <p class="subtitle">Join the Dogfood 2026 Hackathon</p>

    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

    <form action="/register" method="POST" class="form-group">
        <div class="field">
            <label for="full_name">Full Name</label>
            <input type="text" id="full_name" name="full_name" value="{{ full_name or '' }}" required placeholder="Jane Doe">
        </div>
        <div class="field">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" value="{{ email or '' }}" required placeholder="builder@raptors.dev">
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" minlength="6" required placeholder="••••••••">
        </div>
        <div class="field">
            <label for="role">Account Role</label>
            <select id="role" name="role" required>
                {% for r in roles %}
                <option value="{{ r }}">{{ r }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Create Account</button>
    </form>

    <div class="auth-footer">
        <p>Already registered? <a href="/login">Sign in here</a></p>
    </div>
</div>
{% endblock %}
