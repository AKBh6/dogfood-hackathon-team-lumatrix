<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;margin:0;padding:16px}.grid{display:grid;gap:12px}.card{border:1px solid #ddd;border-radius:12px;padding:16px}.muted{color:#666}</style></head><body><div class="grid">{% for s in submissions %}<article class="card"><h3>{{s.title}}</h3><p>{{s.tagline or s.description}}</p><p class="muted">{{s.team.name}} · {{s.track or "General"}}</p><a href="/gallery">Open gallery</a></article>{% endfor %}</div></body></html>
