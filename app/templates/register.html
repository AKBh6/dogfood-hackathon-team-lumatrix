{% extends "base.html" %}{% block title %}Register{% endblock %}{% block nav %}<a href="/login">Login</a>{% endblock %}{% block content %}<div class="auth card"><h1>Create participant account</h1><p class="muted">Public registration creates participant accounts only.</p>{% if error %}<div class="alert danger">{{error}}</div>{% endif %}<form action="/register" method="post"><label>Full name<input name="full_name" required></label><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" minlength="6" required></label><button class="btn" type="submit">Create account</button></form></div>{% endblock %}
